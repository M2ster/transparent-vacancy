[project]
name = "transparent-vacancy"
version = "0.1.0"
description = "Локальная редакторская проверка вакансий"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vacancy_audit"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "SIM"]
